<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPSK Virtual Laboratory</title>
<style>
/* Basic reset */
* {
box-sizing: border-box;
}
body {
margin: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
height: 100vh;
overflow: hidden;
background: #f9f9f9;
color: #222;
}
#container {
display: flex;
width: 100%;
height: 100%;
}
#leftPanel {
width: 320px;
background: #e7e7e7;
padding: 20px 25px;
box-shadow: 2px 0 5px rgba(0,0,0,0.1);
overflow-y: auto;
}
#leftPanel h2 {
margin-top: 0;
font-weight: 600;
margin-bottom: 20px;
font-size: 1.3rem;
color: #333;
}
label {
display: block;
font-weight: 600;
margin-bottom: 6px;
margin-top: 15px;
color: #444;
}
input[type=text], input[type=number] {
width: 100%;
padding: 8px 10px;
font-size: 1rem;
border: 1.8px solid #bbb;
border-radius: 4px;
transition: border-color 0.2s ease;
}
input[type=text]:focus, input[type=number]:focus {
border-color: #005289;
outline: none;
}
.checkbox-group {
display: flex;
align-items: center;
margin-top: 18px;
}
.checkbox-group input[type=checkbox] {
margin-right: 10px;
transform: scale(1.3);
cursor: pointer;
}
.slider-container {
display: flex;
align-items: center;
margin-top: 12px;
gap: 10px;
}
input[type=range] {
flex: 1;
cursor: pointer;
}
#snrValue {
font-weight: 600;
min-width: 35px;
text-align: center;
}
#generateBtn {
margin-top: 28px;
width: 100%;
background: #005289;
color: white;
border: none;
padding: 13px;
font-size: 1.1rem;
font-weight: 700;
border-radius: 5px;
cursor: pointer;
transition: background-color 0.25s ease;
}
#generateBtn:hover {
background: #003f63;
}
#rightPanel {
flex-grow: 1;
padding: 15px;
overflow-y: auto;
background: #fff;
display: grid;
grid-template-columns: repeat(2, 1fr);
grid-template-rows: repeat(3, 1fr);
gap: 18px 20px;
height: 100%;
}
.plotlyChart {
background: #fefefe;
box-shadow: 0 1px 6px rgba(0,0,0,0.1);
border-radius: 6px;
padding: 8px;
}
#resultsSummary {
grid-column: 1 / span 2;
background: #005289;
color: #fff;
padding: 15px 20px;
border-radius: 6px;
font-size: 1.1rem;
font-weight: 600;
user-select: none;
}
/* Scrollbar styling for left panel */
#leftPanel::-webkit-scrollbar {
width: 8px;
}
#leftPanel::-webkit-scrollbar-thumb {
background: #a8a8a8;
border-radius: 4px;
}
#leftPanel::-webkit-scrollbar-thumb:hover {
background: #888;
}
@media (max-width: 900px) {
body {
flex-direction: column;
}
#container {
flex-direction: column;
height: auto;
}
#leftPanel {
width: 100%;
height: auto;
box-shadow: none;
padding-bottom: 10px;
}
#rightPanel {
grid-template-columns: 1fr;
grid-template-rows: none;
height: auto;
padding: 10px 10px 30px;
}
#resultsSummary {
font-size: 1rem;
padding: 12px 15px;
}
}
</style>
</head>
<body>
<div id="container">
<aside id="leftPanel" role="region" aria-label="Controls">
<h2>BPSK Virtual Lab</h2>
<label for="bitSeq">Binary Input Sequence</label>
<input type="text" id="bitSeq" maxlength="64" value="10110101" pattern="[01]*" title="Only 0
and 1 allowed" autocomplete="off" aria-describedby="bitSeqHelp"/>
<small id="bitSeqHelp" style="font-size:0.85rem;color:#666;">Enter bits: 0 or 1 only</small>
<label for="carrierFreq">Carrier Frequency (Hz)</label>
<input type="number" id="carrierFreq" min="0.1" step="0.1" value="5" />
<label for="samplingFreq">Sampling Frequency (Hz)</label>
<input type="number" id="samplingFreq" min="100" step="1" value="1000" />
<label for="amplitude">Amplitude (A)</label>
<input type="number" id="amplitude" min="0.1" step="0.1" value="1" />
<div class="checkbox-group">
<input type="checkbox" id="noiseToggle" />
<label for="noiseToggle" style="margin:0;">Add AWGN Noise</label>
</div>
<label for="snrSlider" style="margin-top: 12px; color:#444;">SNR (dB)</label>
<div class="slider-container">
<input type="range" id="snrSlider" min="-5" max="20" value="10" step="1" disabled />
<span id="snrValue">10</span>
</div>
<button id="generateBtn" aria-label="Generate BPSK signal and update plots">Generate
BPSK Signal</button>
</aside>
<main id="rightPanel" role="main" aria-label="Signal plots and results">
<div id="plotNRZ" class="plotlyChart" aria-label="Input NRZ Bit Waveform"></div>
<div id="plotCarrier" class="plotlyChart" aria-label="Carrier Waveform"></div>
<div id="plotBPSKMod" class="plotlyChart" aria-label="BPSK Modulated Signal"></div>
<div id="plotNoisyBPSK" class="plotlyChart" aria-label="Noisy BPSK Signal"></div>
<div id="plotDemod" class="plotlyChart" aria-label="Demodulated Signal"></div>
<div id="plotRecovered" class="plotlyChart" aria-label="Recovered Bit Waveform"></div>
<section id="resultsSummary" aria-live="polite" aria-atomic="true">
Original Bits: <span id="originalBits"></span><br />
Recovered Bits: <span id="recoveredBits"></span><br />
Bit Error Rate: <span id="ber"></span>
</section>
</main>
</div>
<!-- Plotly.js library (local fallback ready) -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
// Utility: Gaussian random number generator using Box-Muller transform
function gaussianRandom() {
let u = 0, v = 0;
while (u === 0) u = Math.random(); // Caution to avoid 0
while (v === 0) v = Math.random();
return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
// Generate NRZ waveform (+1 for '1', -1 for '0')
function generateNRZ(bits) {
return [...bits].map(bit => bit === '1' ? 1 : -1);
}
// Generate time vector array for the entire signal duration
function generateTimeVector(numBits, fs, bitDuration) {
const totalSamples = numBits * fs * bitDuration;
const time = new Array(totalSamples);
for(let i = 0; i < totalSamples; i++) {
time[i] = i / fs;
}
return time;
}
// Expand NRZ bits to sampled level sequence
function expandNRZ(nrzBits, samplesPerBit) {
const expanded = new Array(nrzBits.length * samplesPerBit);
for(let i = 0; i < nrzBits.length; i++) {
expanded.fill(nrzBits[i], i * samplesPerBit, (i + 1) * samplesPerBit);
}
return expanded;
}
// Generate carrier waveform: A * sin(2*pi*f*t)
function generateCarrier(timeVector, fc, A) {
const carrier = new Array(timeVector.length);
for(let i = 0; i < timeVector.length; i++) {
carrier[i] = A * Math.sin(2 * Math.PI * fc * timeVector[i]);
}
return carrier;
}
// Modulate NRZ with carrier (element-wise multiplication)
function bpskModulate(expandedNRZ, carrier) {
const modulated = new Array(expandedNRZ.length);
for(let i = 0; i < expandedNRZ.length; i++) {
modulated[i] = expandedNRZ[i] * carrier[i];
}
return modulated;
}
// Add AWGN noise based on SNR in dB
function addNoise(signal, snrDB) {
const signalPower = signal.reduce((acc, val) => acc + val*val, 0) / signal.length;
const snrLinear = Math.pow(10, snrDB / 10);
const noisePower = signalPower / snrLinear;
const noiseStd = Math.sqrt(noisePower);
const noisySignal = new Array(signal.length);
for(let i = 0; i < signal.length; i++) {
noisySignal[i] = signal[i] + gaussianRandom() * noiseStd;
}
return noisySignal;
}
// Moving average filter for lowpass smoothing
function movingAverage(signal, windowSize) {
const filtered = new Array(signal.length);
const half = Math.floor(windowSize / 2);
for(let i = 0; i < signal.length; i++) {
let sum = 0;
let count = 0;
for(let j = i - half; j <= i + half; j++) {
if(j >= 0 && j < signal.length) {
sum += signal[j];
count++;
}
}
filtered[i] = sum / count;
}
return filtered;
}
// Demodulate BPSK: multiply by carrier, filter, sample, decide bits
function bpskDemodulate(signal, carrier, samplesPerBit) {
// Step 1: Multiply by carrier
const mixed = new Array(signal.length);
for(let i = 0; i < signal.length; i++) {
mixed[i] = signal[i] * carrier[i];
}
// Step 2: Lowpass filter (moving average with half bit duration window)
const windowSize = Math.floor(samplesPerBit / 2) || 1;
const filtered = movingAverage(mixed, windowSize);
// Step 3: Sample at middle of each bit duration and decide
const numBits = Math.floor(signal.length / samplesPerBit);
const bits = new Array(numBits);
for(let i = 0; i < numBits; i++) {
const sampleIndex = i * samplesPerBit + Math.floor(samplesPerBit / 2);
bits[i] = filtered[sampleIndex] > 0 ? '1' : '0';
}
return bits;
}
// Calculate Bit Error Rate (BER)
function calculateBER(original, recovered) {
let errors = 0;
const length = original.length;
for(let i = 0; i < length; i++) {
if(original[i] !== recovered[i]) errors++;
}
const percent = (errors / length) * 100;
return {errors, total: length, percentage: percent};
}
// Plot waveform using Plotly, with branding hidden
function plotSignal(divId, xData, yData, title, xLabel, yLabel) {
const trace = {
x: xData,
y: yData,
mode: 'lines',
line: {color: '#0074D9'}
};
const layout = {
title: {text: title, font: {size: 16}},
margin: {t: 30, l: 40, r: 15, b: 40},
xaxis: {title: xLabel, zeroline: false},
yaxis: {title: yLabel, zeroline: false},
font: {family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif", size: 12},
plot_bgcolor: '#fefefe',
paper_bgcolor: '#fefefe',
};
const config = {
displayModeBar: false,
displaylogo: false,
responsive: true
};
Plotly.newPlot(divId, [trace], layout, config);
}
// Generate rectangular waveform for NRZ and recovered bits
function plotRectangularSignal(divId, samplesPerBit, bits, title, xLabel) {
// Construct x and y arrays for rectangular waveform steps
const x = [];
const y = [];
for(let i = 0; i < bits.length; i++) {
const start = i;
const end = i + 1;
const level = bits[i] === '1' ? 1 : -1;
x.push(start, end);
y.push(level, level);
}
// Trim last step to match length
plotSignal(divId,
x,
y,
title,
xLabel,
'Amplitude');
}
// Main function: runs full processing chain and updates plots + results
function generateBPSK() {
// Get UI values
const bitSeqRaw = bitSeq.value.trim();
if (!/^[01]*$/.test(bitSeqRaw) || bitSeqRaw.length === 0) {
alert('Invalid bit sequence! Only 0 and 1 characters allowed.');
bitSeq.focus();
return;
}
const bits = bitSeqRaw;
const carrierFreqVal = Number(carrierFreq.value);
const samplingFreqVal = Number(samplingFreq.value);
const amplitudeVal = Number(amplitude.value);
if (carrierFreqVal <= 0 || samplingFreqVal <= carrierFreqVal * 10) {
alert('Ensure carrier frequency is positive and sampling frequency is at least 10 times the
carrier frequency.');
return;
}
if (amplitudeVal <= 0) {
alert('Amplitude must be positive.');
return;
}
const noiseEnabledVal = noiseToggle.checked;
const snrVal = Number(snrSlider.value);
const bitDuration = 1; // seconds per bit
const samplesPerBit = Math.floor(samplingFreqVal * bitDuration);
// Step A: NRZ coding
const nrzBits = generateNRZ(bits);
// Step B: Time vector
const timeVec = generateTimeVector(bits.length, samplingFreqVal, bitDuration);
// Steps C & D: Carrier + BPSK modulate
const carrierWave = generateCarrier(timeVec, carrierFreqVal, amplitudeVal);
const expandedNRZ = expandNRZ(nrzBits, samplesPerBit);
const bpskSignal = bpskModulate(expandedNRZ, carrierWave);
// Step E: Add noise if toggled on
let noisySignal = bpskSignal;
if (noiseEnabledVal) {
noisySignal = addNoise(bpskSignal, snrVal);
}
// Step F: Demodulate signal
const recoveredBits = bpskDemodulate(noisySignal, carrierWave, samplesPerBit);
// Step G: Calculate BER
const berStats = calculateBER(bits, recoveredBits);
// Plotting
plotRectangularSignal('plotNRZ', samplesPerBit, bits, 'Input NRZ Bit Waveform', 'Bit Time
(s)');
plotSignal('plotCarrier', timeVec, carrierWave, 'Carrier Waveform', 'Time (s)', 'Amplitude');
plotSignal('plotBPSKMod', timeVec, bpskSignal, 'BPSK Modulated Signal', 'Time (s)',
'Amplitude');
if (noiseEnabledVal) {
plotSignal('plotNoisyBPSK', timeVec, noisySignal, 'Noisy BPSK Signal', 'Time (s)',
'Amplitude');
} else {
Plotly.purge('plotNoisyBPSK');
const div = document.getElementById('plotNoisyBPSK');
div.innerHTML = '<div style="padding: 20px; text-align:center; color:#999;">Noise
disabled</div>';
}
plotSignal('plotDemod', timeVec, bpskDemodulate(noisySignal, carrierWave, 1),
'Demodulated Signal', 'Time (s)', 'Amplitude');
plotRectangularSignal('plotRecovered', samplesPerBit, recoveredBits.join(''), 'Recovered Bit
Waveform', 'Bit Time (s)');
// Results text
originalBits.textContent = bits;
recoveredBits.textContent = recoveredBits.join('');
ber.textContent = `${berStats.errors} errors out of ${berStats.total} bits
(${berStats.percentage.toFixed(2)}%)`;
}
// DOM elements caching
const bitSeq = document.getElementById('bitSeq');
const carrierFreq = document.getElementById('carrierFreq');
const samplingFreq = document.getElementById('samplingFreq');
const amplitude = document.getElementById('amplitude');
const noiseToggle = document.getElementById('noiseToggle');
const snrSlider = document.getElementById('snrSlider');
const snrValue = document.getElementById('snrValue');
const generateBtn = document.getElementById('generateBtn');
const originalBits = document.getElementById('originalBits');
const recoveredBits = document.getElementById('recoveredBits');
const ber = document.getElementById('ber');
// Update SNR slider UI and enable/disable based on noise toggle
noiseToggle.addEventListener('change', () => {
snrSlider.disabled = !noiseToggle.checked;
generateBPSK();
});
snrSlider.addEventListener('input', () => {
snrValue.textContent = snrSlider.value;
});
generateBtn.addEventListener('click', generateBPSK);
// Generate initial plots on page load
window.onload = () => {
generateBPSK();
};
</script>
</body>
</html>
